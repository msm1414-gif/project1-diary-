[project]
name = "model-router"
version = "0.1.0"
description = "AI-powered router that picks Sonnet, Opus, or Fable for a task."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2",
]

[project.scripts]
model-router = "model_router.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model_router"]
